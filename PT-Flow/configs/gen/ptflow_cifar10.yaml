# PT-Flow on CIFAR-10, pixel space, single GPU (sized for one A40 / A100 40GB).
#
# DIFFERENCES FROM THE IMAGENET CONFIGS, and why each one is forced:
#
#   pipeline: cifar10_pixel selects the whole data path -- loaders, feature
#                           extractor and FID reference together (pipelines/).
#   use_latent/use_cache:   false.  There is no SD-VAE for 32x32x3, so training
#                           happens directly on pixels in [-1, 1].
#   in/out_channels: 3      pixels, not 4-channel SD-VAE latents.
#   feature.use_mae: false  The MAE extractors (hf://mae_latent_*) are trained on
#   feature.use_convnext:   SD-VAE latents of ImageNet.  Feeding CIFAR pixels to
#                    true   them yields meaningless features, and the drift loss
#                           is computed entirely in feature space.  ConvNeXt-V2
#                           takes RGB, upsamples 32 -> 224 and ImageNet-normalizes,
#                           so it is the extractor that actually applies here.
#   activation_kwargs: {}   Those keys (patch_mean_size, every_k_block, ...) are
#                           MAE-only; ConvNeXt.get_activations takes no kwargs.
#
# NOTE cond_dim MUST equal model.hidden_size.  LightningDiTBlock discards its
# cond_dim argument and builds adaLN as Linear(hidden_size, 6*hidden_size).

pipeline: cifar10_pixel

logging:
  use_wandb: false
  log_every_k: 50

dataset:
  name: cifar10
  resolution: 32
  use_aug: true
  use_latent: false
  use_cache: false
  num_classes: 10
  batch_size: 256
  eval_batch_size: 500
  kwargs:
    num_workers: 4
    pin_memory: true
    prefetch_factor: 2

model:
  cond_dim: 384          # must equal hidden_size
  input_size: 32
  in_channels: 3
  patch_size: 2
  hidden_size: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  out_channels: 3
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 0
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: true
  residual: true         # from scratch: identity warm-start, ESS/K = 1 at step 0

optimizer:
  lr_schedule:
    learning_rate: 0.0002
    warmup_steps: 2000
    lr_schedule: "const"
    total_steps: 200000
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  diverse_noise: true
  train_batch_size: 16        # labels per step; ConvNeXt at 224 is the cost driver
  seed: 42
  total_steps: 200000
  save_per_step: 2000
  keep_every: 20000
  keep_last: 2
  eval_per_step: 10000        # raise to 1000000000 to skip FID during training
  pos_per_sample: 16
  neg_per_sample: 8
  positive_bank_size: 256
  negative_bank_size: 1000
  push_per_step: 64
  grad_accum_steps: 2
  forward_dict:
    gen_per_label: 16
    cfg_min: 1.0
    cfg_max: 4.0
    neg_cfg_pw: 3.0
    no_cfg_frac: 0.0
  activation_kwargs: {}       # ConvNeXt takes none; these keys are MAE-only
  loss_kwargs:
    R_list: [0.05]
  cfg_list: [1.0, 1.5, 2.0, 2.5, 3.0]
  ema_decay: 0.9999

  ot_mode: "debiased"
  ot_kwargs:
    sinkhorn_num_iter: 10
    use_new_cfg: true
    disable_diag_mask: true
    resample_neg: true
    batch_sinkhorn: false
    use_quadratic_cost: true

pt:
  enabled: true

  K: 8
  noise_bsz: 32
  data_bsz: 32
  p_uncond: 0.1
  potential_chunk: 0

  prox_max_batch: 64
  prox_mode: "detach"
  scale_K: 4
  scale_mode: "learned"

  lambda_gauge: 0.1
  lambda_mag: 0.0
  logw_clip: 0.0
  max_grad_norm: 1.0
  curv_probe: false
  curv_allow: 0.5
  ema_decay: 0.9999

  model:
    cond_dim: 256
    hidden_size: 256
    depth: 6
    num_heads: 4
    patch_size: 2
    mlp_ratio: 4.0
    use_qknorm: true
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    n_cls_tokens: 0
    use_bf16: true
    attn_fp32: true
    phi_scale: null      # null -> d = 32*32*3 = 3072
    quad_anchor: 0.0
    output_mode: "phi"

  scale_model:
    cond_dim: 128
    hidden_size: 128
    depth: 3
    num_heads: 4
    patch_size: 2
    mlp_ratio: 4.0
    use_qknorm: true
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    n_cls_tokens: 0
    use_bf16: true
    attn_fp32: true
    scale_max: 3.0

  optimizer:
    weight_decay: 0.01
    adam_b1: 0.9
    adam_b2: 0.95
    lr_schedule:
      learning_rate: 0.0002
      warmup_steps: 1000
      lr_schedule: "const"
      total_steps: 200000

  schedule:
    eps_max: 0.2
    eps_min: 0.005
    eps_anneal_steps: 60000
    eps_warmup: 2000
    alpha_def_start: 0.1
    alpha_def_end: 0.01
    alpha_def_degraded: 0.25
    prox_warmup: 20000
    prox_ramp: 30000
    lambda_prox_max: 0.2
    prox_decay_on_degrade: 0.999
    lambda_scale: 0.1
    lambda_curv: 0.0
    theta_period: 1
    theta_period_degraded: 2
    ess_healthy: 0.30
    ess_broken: 0.05
    ess_ema_decay: 0.98

feature:
  use_mae: false
  use_convnext: true
  convnext_bf16: true
  mae_path: ""
